services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:                       # bound to localhost only: Qdrant has no auth configured
      - "127.0.0.1:6333:6333"    # REST API + Web UI (http://localhost:6333/dashboard)
      - "127.0.0.1:6334:6334"    # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    restart: unless-stopped
    ports:                       # bound to localhost only: auth is disabled for local single-user use
      - "127.0.0.1:6006:6006"    # UI + OTLP/HTTP collector (http://localhost:6006)
      - "127.0.0.1:4317:4317"    # OTLP/gRPC collector
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_ENABLE_AUTH=false   # set true + PHOENIX_SECRET and put PHOENIX_API_KEY in .env if you share this server
    volumes:
      - phoenix_data:/mnt/data   # traces persist across restarts

  datasheet-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: datasheet-mcp:latest
    container_name: datasheet-mcp
    restart: unless-stopped
    depends_on: [qdrant, phoenix]
    env_file: .env               # OPENAI_API_KEY, ENTRA_*, MCP_* (see docs/05-mcp-server.md)
    environment:                 # container-network endpoints override the localhost values in .env
      QDRANT_URL: http://qdrant:6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-entra}
      MCP_ALLOW_UNAUTHENTICATED_BIND: "1"   # only used when MCP_AUTH_MODE=none; the port below is localhost-only
    ports:
      - "127.0.0.1:8000:8000"    # MCP endpoint http://localhost:8000/mcp (localhost only)
    volumes:
      - ./pdfs:/data/pdfs:ro     # original PDFs, for get_page_image
      - mcp_oauth:/data/fastmcp  # OAuth proxy state (encrypted client registrations)

volumes:
  qdrant_storage:
  phoenix_data:
  mcp_oauth:

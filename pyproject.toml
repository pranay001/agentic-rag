[project]
name = "pdf-rag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "agent-framework-core>=1.26.0",
    "agent-framework-openai>=1.18.2",
    "arize-phoenix-otel>=0.17.3",
    "fastmcp>=4.2.0",
    "matplotlib>=3.11.2",
    "openai>=3.50.0",
    "openinference-instrumentation-agent-framework>=0.1.17",
    "openinference-instrumentation-openai>=0.1.73",
    "openinference-semantic-conventions>=0.1.44",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "trulens>=2.16.0",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]
# minimal runtime for the MCP server container (uv sync --only-group mcp)
mcp = [
    "fastmcp>=4.2.0",
    "qdrant-client>=1.20.0",
    "openai>=3.50.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "truststore>=0.10.5",
    "arize-phoenix-otel>=0.17.3",
    "openinference-instrumentation-openai>=0.1.73",
    "openinference-semantic-conventions>=0.1.44",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
